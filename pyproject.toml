[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "eks-harness"
dynamic = ["version"]
description = "Plugin-driven harness for driving, capturing and editing apps: browser and device pools, backends, an artifact store, a video engine with Blender and web scenes, synchronized scores and a web UI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "platformdirs>=4.2",
    "argon2-cffi>=23.1",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "rich>=13.7",
    "prompt_toolkit>=3.0.52",
    "mcp>=2.2",
    "websockets>=13",
    "pydantic>=2.7",
    "resvg-py==0.5.0",
    "Pillow>=11",
    "fonttools>=4.50",
]

[project.optional-dependencies]
video = [
    "pydantic>=2.7",
    "pluggy>=1.3",
    "diskcache>=5.6",
    "av>=11.0",
    "numpy>=1.26",
    "soundfile>=0.12",
    "librosa>=0.10",
    "asteval>=0.9.31",
    "pillow>=10.0",
    "websockets>=13",
    "psutil>=5.9",
    "pynvml>=11; platform_system != 'Darwin'",
    "wmi>=1.5; platform_system == 'Windows'",
    "pywin32>=306; sys_platform == 'win32'",
]
ml = [
    "eks-harness[video,html]",
    "madmom>=0.16",
    "BeatNet>=1.1.3",
    "pyaudio>=0.2.14",
    "numpy<2.4",
    "faster-whisper>=1.0",
    "av<19",
    "kornia>=0.7",
    "skia-python>=87.5",
    "mediapipe>=0.10",
    "rembg>=2.0",
    "opencv-python-headless>=4.9",
]
download = [
    "yt-dlp>=2024.0.0",
]
mac = [
    "mlx-whisper; sys_platform == 'darwin' and platform_machine == 'arm64'",
]
gpu = [
    "torch>=2.2",
]
sam3 = [
    "timm>=1.0.17",
    "iopath>=0.1.10",
    "ftfy==6.1.1",
    "hydra-core>=1.3",
    "pycocotools",
    'triton-windows; platform_system == "Windows"',
    'triton; platform_system == "Linux" and platform_machine == "x86_64"',
]
matting = [
    "rembg>=2.0",
    "thinplate @ git+https://github.com/cheind/py-thin-plate-spline",
]
html = [
    "playwright>=1.45",
]
stems = [
    "demucs>=4.1",
]
denoise = [
    "deepfilternet>=0.5",
    "torchaudio>=2.1,<2.9",
]
captions-onnx = [
    "optimum>=2.0",
    "optimum-onnx>=0.1",
]
winml = [
    "onnxruntime-windowsml; platform_system == 'Windows'",
    "wasdk-Microsoft.Windows.AI.MachineLearning; platform_system == 'Windows'",
    "wasdk-Microsoft.Windows.ApplicationModel.DynamicDependency.Bootstrap; platform_system == 'Windows'",
    "winrt-Windows.Foundation; platform_system == 'Windows'",
]
all = [
    "eks-harness[video,ml,download,mac,html,stems]",
]

[project.scripts]
eks-harness = "eks_harness.cli:main"
ehx = "eks_harness.cli:main"

[dependency-groups]
dev = [
    "eks-harness[video,html]",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[tool.uv]
link-mode = "clone"
environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
]
required-environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
]

[tool.uv.sources]
madmom = { git = "https://github.com/CPJKU/madmom", rev = "27f032e" }
BeatNet = { git = "https://github.com/mjhydri/BeatNet", rev = "81cedd4" }

[[tool.uv.dependency-metadata]]
name = "deepfilternet"
version = "0.5.6"
requires-python = ">=3.8,<4.0"
requires-dist = [
    "appdirs>=1.4,<2.0",
    "deepfilterlib==0.5.6",
    "loguru>=0.5",
    "numpy>=1.22",
    "packaging>=23.0",
    "requests>=2.27,<3.0",
    "sympy>=1.6",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.version]
path = "src/eks_harness/_version.py"

[tool.hatch.build.targets.sdist]
include = [
    "pyproject.toml",
    "hatch_build.py",
    "README.md",
    "src",
    "web",
    "sdk",
    "workers",
    "package.json",
    "pnpm-workspace.yaml",
    "pnpm-lock.yaml",
]
exclude = [
    "**/node_modules",
    "web/dist",
    "sdk/*/dist",
    "workers/*/dist",
    "src/eks_harness/assets/scene-runtime.js",
    "src/eks_harness/_workers",
    "src/eks_harness/web_dist",
    "src/eks_harness/_build.json",
    "__pycache__",
]

[tool.hatch.build.targets.wheel]
packages = ["src/eks_harness"]
artifacts = [
    "src/eks_harness/web_dist/**",
    "src/eks_harness/assets/**",
    "src/eks_harness/_workers/**",
    "src/eks_harness/_build.json",
]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
